  <style>
:root{--paper:#f7f6f0;--card:#fffef9;--ink:#1e302a;--green:#173f33;--leaf:#306048;--muted:#5f6a60;--line:#d8dccf;--soft:#e9efe2;--orange:#9b492b;--gold:#ddad6f;--radius:14px;font:16px/1.55 "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;color:var(--ink);background:var(--paper);font-synthesis:none}

.filter-strip{display:flex;flex-wrap:wrap;gap:5px}.filter-strip button{background:transparent;border:1px solid transparent;color:#626e60;border-radius:100px;font-weight:650;font-size:13px;padding:4px 10px;white-space:nowrap}.filter-strip button[aria-pressed=true]{background:var(--soft);border-color:#b7cbb6;color:#234a39}.filter-strip button:hover:not([aria-pressed=true]){background:#f0f2e9}.filter-strip .filter-count{font-size:11px;margin-left:4px;font-variant-numeric:tabular-nums}.category-select{border:1px solid var(--line);padding:6px 8px;border-radius:6px;width:100%;background:white;color:var(--ink);font-size:13px}

.detail{overflow:hidden;min-width:0;scroll-margin-top:10px}.hero{padding:26px 29px 25px;background:var(--green);color:#fffcf2}.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.back{border:1px solid #6b8474;color:#f1f5e9;background:transparent;font-size:12px;padding:3px 10px;border-radius:100px}.hero .kind{font-size:13px;font-weight:650;color:#d3dfc9}.hero .kind:before{content:"";display:inline-block;margin-right:8px;width:8px;height:8px;border-radius:50%;background:var(--gold)}.hero h2{margin:12px 0 7px;font-weight:720;font-size:clamp(27px,3.2vw,40px);overflow-wrap:anywhere}.hero .details{font-size:14px;color:#e0e9d9;display:flex;flex-wrap:wrap;gap:0 13px}.hero .details strong{font-weight:700;color:#fffcf2}.content-section{padding:23px 28px 26px}.content-section+.content-section{border-top:1px solid var(--line)}.content-section h3{font-size:22px}.content-section>.section-head{margin-bottom:18px}.subgroup+.subgroup{margin-top:17px}.subgroup h4{font-size:13px;color:var(--muted);margin:0 0 7px;font-weight:650;letter-spacing:-.02em}.menu-grid,.ingredient-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.item-link{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;min-height:42px;border:1px solid #d6dece;border-radius:7px;background:white;padding:8px 11px;gap:8px;font-weight:650;font-size:14px;line-height:1.45;overflow-wrap:anywhere}.item-link>.arrow,.peer-link>.arrow{color:var(--leaf);font-weight:500}.ingredient-grid .item-link{align-items:start;flex-direction:column;gap:0;padding:9px 12px}.ingredient-grid .item-link span:last-child{font-size:11px;color:var(--muted);font-weight:500}.ingredient-grid .item-link.is-highlighted{background:#ecf3e8;border-color:#a9c4a7;color:#274a35}.ingredient-grid .item-link.is-highlighted[data-type=single]{background:#f9eee1;border-color:#d6b795;color:#744927}.ingredient-grid .item-link.is-muted{color:#6e726c;background:#f1f1ed;border-color:#e1e3db         node.dataset.type=type;
        const uses = usages.get(name).length-1;
        node.append(el("span","",name),el("span","",uses ? "공용 · 다른 메뉴 "+uses+"개" : "단독 · 이 메뉴만 사용"));
        grid.append(node);
      }
      return grid;
    };
    const direct = names.filter(name => menu.direct.has(name));
    const inPrep = names.filter(name => !menu.direct.has(name));
    if (direct.length) result.append(gridFor(direct));
    if (inPrep.length) {
      const prep = el("details","prep");
      prep.open = filter !== "all";
      prep.append(el("summary","","배합 속 재료 "+inPrep.length+"개"),gridFor(inPrep));
      result.append(prep);
    }
    if (!names.length) result.append(el("p","empty","등록된 재료가 없습니다."));
    else if (!names.some(n => matchesType(n,filter))) result.append(el("p","empty","이 메뉴에 "+labels[filter]+" 재료가 없습니다."));
    return result;
  }
  function peerSection(menu) {
    const overlaps = new Map();
    for (const ingredient of menu.ingredients) for (const other of usages.get(ingredient)) {
      if (other.id === menu.id) continue;
      if (!overlaps.has(other)) overlaps.set(other,[]);
      overlaps.get(other).push(ingredient);
    }
    const ranked = [...overlaps].sort((a,b) => b[1].length-a[1].length || compare(a[0].name,b[0].name));
    const outer = section("같은 재료를 쓰는 메뉴",ranked.length+"개");
    const rows = el("div","");
    const makePeer = ([other, ingredients]) => {
      const row = el("details","peer");
      const summary = el("summary");
      summary.append(el("strong","",other.name),el("span","","겹치는 재료 "+ingredients.length+"개"));
      const chips = el("ul","overlap-list");
      for (const name of [...ingredients].sort(compare)) {
        const li = el("li");
        li.append(btn("",name,() => navigate("ingredient",name,true)));
        chips.append(li);
      }
      row.append(summary,chips,btn("peer-link","메뉴 열기 →",() => navigate("menu",other.id,true)));
      return row;
    };
    ranked.slice(0,peersShown).forEach(entry => rows.append(makePeer(entry)));
    outer.append(rows);
    if (ranked.length > peersShown) {
      const more = btn("more","나머지 "+(ranked.length-peersShown)+"개 메뉴 보기",() => {
        const start=peersShown;
        ranked.slice(start).forEach(entry => rows.append(makePeer(entry)));
        peersShown=ranked.length;
        more.remove();
        rows.children[start].querySelector("summary").focus();
      });
      outer.append(more);
    }
    if (!ranked.length) outer.append(el("p","empty","이 메뉴와 재료를 함께 쓰는 메뉴가 없습니다."));
    return outer;
  }
  function renderDetail() {
    const isMenu=mode === "menu";
    const item=isMenu ? byId.get(selected) : undefined;
    const hero=el("div","hero");
    const top=el("div","hero-top");
    top.append(el("div","kind",isMenu ? item.category : shared(selected) ? "공용 재료" : "단독 재료"));
    if ((history.state?.menuDepth || 0)>0) top.append(btn("back","← 이전 선택",() => history.back()));
    const h=el("h2","",isMenu ? item.name : selected); h.id="item-title";
    const meta=el("div","details");
    if (isMenu) {
      const common = item.ingredients.filter(shared).length;
      meta.append(el("span","","공용 재료 "+common+"개"),el("span","","단독 재료 "+(item.ingredients.length-common)+"개"));
      if (item.ingredients.some(name => !item.direct.has(name))) meta.append(el("small","","배합 속 재료 포함"));
    } else {
      const used=usages.get(selected);
      meta.append(el("span","",used.length+"개 메뉴에서 사용"));
    }
    hero.append(top,h,meta);
    detail.replaceChildren(hero);
    if (isMenu) {
      const recipe=el("div","menu-detail"+(filter === "single" ? " solo-view" : ""));
      recipe.append(ingredientsSection(item));
      if (filter !== "single") recipe.append(peerSection(item));
      detail.append(recipe);
    } else detail.append(ingredientResult());
    document.title=h.textContent+" · 메뉴와 식재료";
    $("#status").textContent=h.textContent+" 선택. "+meta.textContent;
  }
  function render() {
    const isMenu = mode === "menu";
    for(const node of document.querySelectorAll("[data-mode]")) pressed(node,node.dataset.mode === mode);
    $("#catalog-title").textContent=isMenu ? "메뉴 목록" : "재료 목록";
    search.placeholder=isMenu ? "메뉴 이름 검색" : "재료 이름 검색";
    search.setAttribute("aria-label",search.placeholder);
    search.value=browse[mode].search;
    renderCatalogFilters(); renderList(); renderDetail();
    const current = catalog.querySelector("[aria-current=true]");
    if (current) {
      const row = current.getBoundingClientRect();
      const bounds = catalog.getBoundingClientRect();
      if (row.bottom > bounds.bottom) catalog.scrollTop += row.bottom - bounds.bottom;
      else if (row.top < bounds.top) catalog.scrollTop -= bounds.top - row.top;
    }
  }
  if (!menus.length || !ingredientNames.length) {
    detail.append(el("p","empty","메뉴 데이터를 불러오지 못했습니다."));
    return;
  }
  $("#summary").append(el("span","","메뉴·옵션 "+menus.length+"개"),el("span","","식재료·배합 "+ingredientNames.length+"종"));
  search.addEventListener("input",() => {browse[mode].search=search.value;renderList();});
  document.querySelectorAll("[data-mode]").forEach(node => node.addEventListener("click",() => switchMode(node.dataset.mode)));
  $(".skip").addEventListener("click",ev => {ev.preventDefault();detail.focus();});
  const routeChange = () => {readRoute();peersShown=6;render();};
  window.addEventListener("popstate",routeChange);
  window.addEventListener("hashchange",routeChange);
  readRoute();
  writeRoute(true);
  render();
})();

</script>
</body>
</html>
