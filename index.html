<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173f33">
  <title>My Viet 브랜드 식자재</title>
  <style>
:root {
  color-scheme: light;
  --paper: #f7f5ed;
  --card: #fffdf7;
  --ink: #1c352b;
  --green: #173f33;
  --leaf: #345b47;
  --muted: #545f54;
  --line: #d6d8c9;
  --soft: #e9eee2;
  --orange: #94472e;
  --gold: #dba96b;
  --radius: 16px;
  font: 16px/1.5 "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  color: var(--ink);
  background: var(--paper);
}
* { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
h1,h2,h3,h4,p { margin: 0; }
h1,h2,h3,h4 { word-break: keep-all; overflow-wrap: anywhere; }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
button, select { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid #a87135; outline-offset: 3px; }
.shell { width: min(1240px, calc(100% - 72px)); margin-inline: auto; }
main.shell { padding-block: 30px 50px; }
.main-header { background: var(--green); color: var(--card); }
.header-inner { min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.wordmark { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 780; letter-spacing: -.035em; }
.brand-mark { display: flex; align-items: end; gap: 3px; transform: skew(-12deg); }
.brand-mark i { width: 4px; height: 19px; border-radius: 4px; background: var(--gold); }
.brand-mark i:first-child { height: 10px; }
.brand-mark i:last-child { height: 15px; }
.main-header nav { display: flex; gap: 5px; padding-block: 8px; }
.main-header nav a { display: flex; align-items: center; justify-content: center; min-height: 48px; padding: 6px 20px; border: 1px solid transparent; border-radius: 100px; text-decoration: none; font-weight: 750; white-space: nowrap; }
.main-header nav a:hover { background: #305749; }
.main-header nav a[aria-current=page] { background: #f4f5eb; color: var(--ink); }
.skip-link { position: fixed; left: 12px; top: 8px; padding: 12px; background: var(--card); z-index: 10; }
.skip-link:not(:focus) { clip-path: inset(50%); width: 1px; height: 1px; overflow: hidden; }
@media (max-width: 700px) {
  .shell { width: calc(100% - 32px); }
  main.shell { padding-top: 22px; }
  .header-inner { min-height: 55px; }
  .wordmark { font-size: 16px; }
  .main-header nav a { min-height: 44px; padding-inline: 12px; font-size: 14px; }
}
@media (max-width: 475px) {
  .header-inner { display: block; padding-top: 12px; }
  .main-header nav { width: 100%; padding-block: 9px 8px; }
  .main-header nav a { width: 50%; }
}

#ingredients {
  --ing-ink: #1e3428;
  --ing-pine: #215541;
  --ing-muted: #586957;
  --ing-line: #dbdecf;
  --ing-panel: #fffcf5;
  color: var(--ing-ink);
}
#ingredients [hidden] { display: none !important; }
.ing-tools, .ing-scope, .ing-check, .ing-sort, .ing-head {
  display: flex;
  align-items: center;
}
.ing-tools {
  gap: 10px 16px;
  flex-wrap: wrap;
}
.ing-search {
  position: relative;
  flex: 1 1 230px;
  min-width: 0;
}
.ing-search::before {
  position: absolute;
  inset-inline-start: 15px;
  top: calc(50% - 8px);
  width: 12px;
  height: 12px;
  border: 1.8px solid var(--ing-muted);
  border-radius: 50%;
  content: "";
  pointer-events: none;
}
.ing-search::after {
  position: absolute;
  inset-inline-start: 27px;
  top: calc(50% + 4px);
  width: 6px;
  height: 1.5px;
  background: var(--ing-muted);
  transform: rotate(44deg);
  content: "";
  pointer-events: none;
}
.ing-search input, .ing-sort select, .ing-compare select {
  min-height: 48px;
  color: var(--ing-ink);
  background: var(--ing-panel);
  border: 1px solid #bdc6b6;
  border-radius: 8px;
  font: inherit;
}
.ing-search input {
  width: 100%;
  box-sizing: border-box;
  padding: 8px 12px 8px 39px;
}
.ing-sort { gap: 8px; }
.ing-sort span {
  color: var(--ing-muted);
  font-size: 14px;
  font-weight: 650;
}
.ing-sort select, .ing-compare select {
  max-width: 100%;
  padding: 8px 9px;
  font-size: 15px;
  font-weight: 660;
}
.ing-scope { gap: 6px 14px; flex-wrap: wrap; }
.ing-check {
  gap: 5px;
  min-height: 44px;
  color: var(--ing-muted);
  font-size: 14px;
  white-space: nowrap;
  cursor: pointer;
}
.ing-check input {
  width: 17px;
  height: 17px;
  accent-color: var(--ing-pine);
}
.ing-compare {
  margin: 6px 0 11px;
  border-bottom: 1px solid var(--ing-line);
}
.ing-compare summary {
  min-height: 44px;
  width: fit-content;
  padding: 10px 7px 8px 0;
  color: var(--ing-pine);
  font-size: 15px;
  font-weight: 720;
  cursor: pointer;
}
.ing-compare-body {
  display: grid;
  gap: 12px;
  padding: 0 0 14px;
}
.ing-compare select { justify-self: start; width: min(100%, 310px); }
.ing-chosen, .ing-common { display: flex; flex-wrap: wrap; gap: 8px; }
.ing-chosen:empty, .ing-common:empty { display: none; }
.ing-chosen-menu {
  min-height: 44px;
  padding: 6px 12px;
  color: #fffdf3;
  background: var(--ing-pine);
  border-radius: 8px;
  font: inherit;
}
.ing-comparison p {
  margin: 0;
  font-size: 15px;
  color: var(--ing-muted);
}
.ing-comparison .ing-common-title {
  margin-bottom: 7px;
  color: var(--ing-pine);
  font-weight: 720;
}
.ing-head {
  justify-content: space-between;
  gap: 10px;
  min-height: 39px;
  margin-bottom: 2px;
  font-size: 13px;
}
.ing-head-menus { color: var(--ing-muted); }
.ing-count {
  color: var(--ing-pine);
  font-size: 15px;
  font-weight: 740;
}
.ing-list {
  display: grid;
  gap: 7px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.ing-list:empty { display: none; }
.ing-row {
  display: grid;
  grid-template-columns: minmax(142px, 25%) minmax(0, 1fr);
  gap: 9px 16px;
  align-items: center;
  padding: 10px 14px;
  background: var(--ing-panel);
  border: 1px solid var(--ing-line);
  border-radius: 9px;
}
.ing-item-heading {
  display: flex;
  align-items: center;
  min-width: 0;
  gap: 8px;
}
.ing-name {
  margin: 0;
  min-width: 0;
  font-size: 19px;
  line-height: 1.35;
  font-weight: 740;
  letter-spacing: -.025em;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
.ing-usage-count {
  display: inline-block;
  flex-shrink: 0;
  padding: 3px 7px;
  color: var(--ing-pine);
  background: #e6eee3;
  border-radius: 6px;
  font-size: 13px;
  line-height: 1.4;
  font-weight: 740;
  white-space: nowrap;
}
.ing-menu-links {
  display: flex;
  flex-wrap: wrap;
  gap: 5px 6px;
}
.ing-menu, .ing-more {
  min-height: 40px;
  max-width: 100%;
  padding: 6px 10px;
  border: 1px solid #d4ded0;
  border-radius: 7px;
  color: var(--ing-pine);
  background: #f0f4ea;
  font-size: 14px;
  font-weight: 670;
  letter-spacing: -.018em;
  line-height: 1.35;
  text-align: left;
  overflow-wrap: anywhere;
}
.ing-more {
  background: transparent;
  border-color: #bdc6b6;
  color: #425e4c;
}
.ing-menu:hover, .ing-more:hover { background: #dae8db; }
.ing-empty {
  margin: 0;
  padding: 16px;
  color: var(--ing-muted);
  background: var(--ing-panel);
  border: 1px solid var(--ing-line);
  border-radius: 8px;
}
#ingredients :focus-visible {
  outline: 2px solid #af743b;
  outline-offset: 2px;
}
@media(max-width: 760px) {
  .ing-tools { column-gap: 8px; row-gap: 2px; }
  .ing-search { flex-basis: 160px; }
  .ing-sort span { display: none; }
  .ing-scope { width: 100%; }
  .ing-row { grid-template-columns: 1fr; padding: 10px 11px; }
  .ing-menu, .ing-more { min-height: 44px; font-size: 13px; }
  .ing-name { font-size: 17px; }
}
@media(max-width: 350px) {
  .ing-search { flex-basis: 136px; }
  .ing-search input { padding-inline-start: 12px; }
  .ing-search::before, .ing-search::after { display: none; }
  .ing-sort select { font-size: 14px; }
}

#kitchen {
  --kt-ink: #19362a;
  --kt-accent: #174536;
  --kt-muted: #566354;
  --kt-border: #d8d5c6;
  --kt-card: #fffdf5;
  --kt-paper: #f8f6ed;
  color: var(--kt-ink);
}

#kitchen [hidden] { display: none !important; }
.kt-sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.kt-list-title {
  margin: 0 0 16px;
  font-size: clamp(26px, 3.5vw, 38px);
  letter-spacing: -.04em;
}
.kt-controls {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 10px 20px;
  padding: 1px 0 17px;
  border-bottom: 1px solid var(--kt-border);
}
.kt-filters { display: flex; flex-wrap: wrap; gap: 7px; }
.kt-filter, .kt-back {
  min-height: 44px;
  border: 1px solid var(--kt-border);
  color: var(--kt-ink);
  background: var(--kt-card);
  border-radius: 8px;
  font: inherit;
  font-weight: 690;
  cursor: pointer;
}
.kt-filter {
  padding: 7px 13px;
  font-size: 14px;
  border-radius: 30px;
}
.kt-filter[aria-pressed='true'] {
  border-color: var(--kt-accent);
  background: var(--kt-accent);
  color: #fffdf5;
}
.kt-search {
  position: relative;
  display: flex;
  flex: 0 1 235px;
  min-width: 0;
  max-width: 100%;
  align-items: center;
}
.kt-search::before, .kt-search::after {
  position: absolute;
  left: 13px;
  content: '';
  pointer-events: none;
}
.kt-search::before {
  top: calc(50% - 7px);
  width: 10px;
  height: 10px;
  border: 1.5px solid #66786b;
  border-radius: 50%;
}
.kt-search::after {
  top: calc(50% + 5px);
  width: 6px;
  height: 1.5px;
  transform: translateX(9px) rotate(45deg);
  background: #66786b;
}
.kt-search input {
  width: 100%;
  box-sizing: border-box;
  min-height: 44px;
  padding: 8px 12px 8px 35px;
  border: 1px solid var(--kt-border);
  border-radius: 8px;
  color: var(--kt-ink);
  background: var(--kt-card);
  font: inherit;
  font-size: 16px;
}
.kt-category { margin: 22px 0 0; }
.kt-category-title {
  margin: 0 0 8px;
  color: var(--kt-muted);
  font-size: 15px;
  font-weight: 730;
}
.kt-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(220px, 100%), 1fr));
  gap: 9px;
}
.kt-menu {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
  min-height: 62px;
  padding: 11px 15px;
  border: 1px solid var(--kt-border);
  border-radius: 10px;
  color: var(--kt-ink);
  background: var(--kt-card);
  text-align: left;
  font: inherit;
  font-size: 16px;
  font-weight: 750;
  line-height: 1.35;
  word-break: keep-all;
  overflow-wrap: anywhere;
  cursor: pointer;
}
.kt-menu:hover, .kt-back:hover, .kt-filter:not([aria-pressed='true']):hover {
  border-color: #818f76;
  background: #eeefe3;
}
.kt-menu-arrow, .kt-back-arrow {
  color: #466350;
  flex-shrink: 0;
  font-size: 25px;
  line-height: .8;
}
.kt-empty {
  margin: 13px 0;
  padding: 14px;
  border-radius: 8px;
  background: #efede2;
  color: var(--kt-muted);
}

.kt-recipe { margin: 0 auto; width: 100%; }
.kt-recipe-bar {
  display: flex;
  align-items: center;
  padding-bottom: 12px;
}
.kt-back {
  display: inline-flex;
  gap: 9px;
  align-items: center;
  padding: 7px 14px;
  font-size: 15px;
}
.kt-recipe-title {
  padding: clamp(17px, 2.5vw, 30px);
  border-radius: 13px 13px 0 0;
  background: var(--kt-accent);
  color: #fffdf5;
}
.kt-recipe-info {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
  color: #e1e8dc;
  font-size: 14px;
  line-height: 1.3;
}
.kt-status {
  padding: 3px 7px;
  border-radius: 5px;
  background: #f1e2c1;
  color: #49361c;
  font-weight: 750;
}
.kt-recipe-name {
  margin: 6px 0 0;
  font-size: clamp(24px, 3.7vw, 44px);
  line-height: 1.15;
  letter-spacing: -.038em;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
.kt-recipe-name:focus { outline: none; }
.kt-portion {
  margin: 8px 0 0;
  color: #e1e8dc;
  font-size: 15px;
  line-height: 1.4;
  overflow-wrap: anywhere;
}
.kt-measure {
  padding: clamp(13px, 2.2vw, 23px);
  border: 1px solid var(--kt-border);
  border-top: none;
  border-radius: 0 0 13px 13px;
  background: var(--kt-card);
}
.kt-measure-title {
  margin: 0;
  font-size: 20px;
  letter-spacing: -.035em;
}
.kt-source-note {
  margin: 8px 0;
  padding: 8px 11px;
  border-left: 3px solid #b69a69;
  background: #f6f0df;
  color: #51472f;
  font-size: 14px;
  line-height: 1.45;
  overflow-wrap: anywhere;
}
.kt-ingredients {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px 12px;
  margin: 12px 0 0;
  padding: 0;
  list-style: none;
}
.kt-ingredient {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 6px 12px;
  min-height: 58px;
  padding: 7px 12px;
  border: 1px solid #e0ded0;
  border-radius: 7px;
  background: var(--kt-paper);
}
.kt-ingredient-label {
  display: flex;
  flex-direction: column;
  align-items: start;
  gap: 2px;
  min-width: 0;
  overflow-wrap: anywhere;
  word-break: keep-all;
}
.kt-ingredient-name {
  font-size: clamp(16px, 1.5vw, 20px);
  font-weight: 730;
  line-height: 1.3;
}
.kt-ingredient-note {
  color: var(--kt-muted);
  font-size: 13px;
  line-height: 1.35;
}
.kt-amount {
  max-width: 24ch;
  color: var(--kt-accent);
  font-size: clamp(16px, 2vw, 24px);
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  text-align: right;
  line-height: 1.18;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
.kt-unconfirmed {
  color: #805421;
  font-size: 14px;
}
@media (max-width: 670px) {
  .kt-search { flex: 1 1 100%; }
  .kt-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kt-menu { min-height: 60px; font-size: 15px; padding: 9px 10px; gap: 5px; }
  .kt-category { margin-top: 16px; }
  .kt-ingredients { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .kt-ingredient { min-height: 48px; }
  .kt-amount { max-width: 16ch; }
}

.ing-picture-trigger {
  background: transparent; border: 0; padding: 0; color: inherit;
  font: inherit; display: flex; align-items: center; gap: 8px; text-align: left; min-height: 44px; max-width: 100%;
}
.ing-picture-trigger:hover { color: var(--leaf); text-decoration: underline; text-underline-offset: .18em; }
.ing-row-art { flex: 0 0 48px; width: 48px; height: 43px; }
.ing-row-art > svg, .ingredient-focus-art > svg { display: block; width: 100%; height: 100%; }
body:has(.ingredient-dialog[open]) { overflow: hidden; }
.ingredient-dialog {
  border: 0; background: transparent; padding: 0; width: 100%; height: 100%;
  max-width: none; max-height: none; color: var(--ink); overflow: hidden;
}
.ingredient-dialog[open] { display: grid; place-items: center; }
.ingredient-dialog::backdrop { background: #132b26aa; }
.ingredient-panel {
  position: relative; display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.2fr);
  grid-template-rows: minmax(0, 1fr); align-items: center; gap: 24px;
  width: min(920px, calc(100% - 30px)); height: min(540px, calc(100dvh - 30px));
  background: var(--card); border: 1px solid var(--line); border-radius: 18px;
  padding: 47px 32px 25px; box-shadow: 0 15px 55px #132b2640; overflow: hidden;
}
.ingredient-close {
  position: absolute; top: 9px; right: 10px; z-index: 1; min-height: 42px; min-width: 42px;
  border: 1px solid var(--line); border-radius: 50%; background: var(--paper); font-size: 24px;
}
.ingredient-focus { position: relative; text-align: center; min-width: 0; }
.ingredient-focus-art {
  margin: 0 auto 8px; width: min(100%, 280px); height: min(29dvh, 240px);
  transform-origin: top left; pointer-events: none;
}
.ingredient-focus-name { font-size: clamp(17px, 3.5vw, 34px); }
.ingredient-focus::after {
  content: ""; position: absolute; top: 50%; left: calc(100% + 3px);
  width: 21px; border-top: 1px solid var(--orange);
}
.ingredient-uses {
  min-height: 0; min-width: 0; align-self: stretch; display: flex; flex-direction: column; justify-content: center;
}
.ingredient-uses h3 { margin: 0 0 10px 16px; font-size: 17px; }
.ingredient-use-list {
  margin: 0; padding: 2px 5px 2px 17px; list-style: none; min-height: 0;
  overflow-y: auto; scrollbar-gutter: stable; overscroll-behavior: contain; border-left: 1px solid var(--orange);
}
.ingredient-use-row { position: relative; }
.ingredient-use-row + .ingredient-use-row { margin-top: 6px; }
.ingredient-use-row::before {
  content: "→"; position: absolute; top: 50%; right: 100%;
  width: 17px; line-height: 1; transform: translateY(-50%); color: var(--orange); text-align: center;
}
.ingredient-use-menu {
  width: 100%; min-height: 44px; padding: 7px 10px; text-align: left;
  border: 1px solid var(--line); background: var(--soft); border-radius: 8px; font-weight: 700;
  word-break: keep-all; overflow-wrap: anywhere;
}
.ingredient-use-menu:hover { border-color: var(--leaf); }
@media (max-width: 540px) {
  .ingredient-panel { padding: 53px 10px 16px; gap: 12px; grid-template-columns: minmax(0, .68fr) minmax(0, 1.5fr); }
  .ingredient-focus::after { width: 9px; }
  .ingredient-uses h3 { font-size: 15px; }
  .ingredient-focus-art { height: min(24dvh, 115px); }
  .ingredient-use-menu { font-size: 14px; }
}

.kt-recipe-body { touch-action: pan-y pinch-zoom; }
.kt-recipe-tabs {
  display: flex; gap: 6px; padding: 12px clamp(12px, 2.5vw, 28px);
  border-inline: 1px solid var(--line); background: var(--card);
}
.kt-recipe-tabs button {
  min-height: 44px; border-radius: 8px; border: 1px solid var(--line);
  padding: 7px 17px; background: var(--paper); font-weight: 750;
}
.kt-recipe-tabs button[aria-pressed=true] { background: var(--green); border-color: var(--green); color: white; }
.kt-method {
  border: 1px solid var(--line); border-top: 0; border-radius: 0 0 14px 14px;
  padding: 10px clamp(12px, 2vw, 24px) 24px; background: var(--card);
}
.kt-steps {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px; margin: 0; padding: 0; list-style: none;
}
.kt-steps li { padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); }
 .kt-step-art {
  position: relative; border-radius: 9px; aspect-ratio: 3 / 2;
  background-color: #eeeadd; background-image: var(--cooking-photo);
  background-size: 300% 300%; background-repeat: no-repeat;
}
.kt-picture-measure {
  position: absolute; left: 8px; top: 8px; padding: 4px 8px;
  border-radius: 6px; color: #fffef7; background: #163b30;
  font-size: 14px; font-weight: 750; line-height: 1.25; white-space: nowrap;
}
.kt-picture-measure + .kt-picture-measure { left: auto; top: auto; right: 8px; bottom: 8px; }
.kt-steps h3 { margin: 13px 0 4px; font-size: clamp(16px,1.9vw,22px); }
.kt-steps p { color: var(--muted); line-height: 1.55; }
@media (max-width: 660px) {
  .kt-steps { grid-template-columns: 1fr; }
  .kt-steps li { display: grid; grid-template-columns: minmax(68px, .75fr) minmax(0, 1.7fr); column-gap: 10px; align-content: center; }
  .kt-step-art { grid-row: span 2; align-self: start; }
  .kt-picture-measure { left: 3px; top: 3px; padding: 2px 4px; font-size: 11px; }
  .kt-picture-measure + .kt-picture-measure { right: 3px; bottom: 3px; }
  .kt-steps h3 { margin: 1px 0 4px; }
  .kt-steps p { font-size: 14px; }
}

    const controls = document.createElement("div");
    controls.className = "kt-recipe-tabs";

      directions.setAttribute("aria-pressed", String(showMethod));

(() => {
  function initialize() {
    const root = document.getElementById("ingredients");
    if (!root || root.dataset.ready) return;
    root.dataset.ready = "true";

    const menus = window.MENU_DATA.menus;
    const byId = new Map(menus.map(menu => [menu.id, menu]));
    const collate = new Intl.Collator("ko", { numeric: true }).compare;
    const normalize = text => text.normalize("NFC").toLocaleLowerCase("ko").replace(/[\s·/]/g, "");
    const inputs = (menu, full) => full ? menu.ingredients : menu.directIngredients || menu.ingredients;
    const usageIndex = full => {
      const usage = new Map();
      for (const menu of menus) {
        for (const name of new Set(inputs(menu, full))) {
          if (!usage.has(name)) usage.set(name, []);
          usage.get(name).push(menu);
        }
      }
      return usage;
    };
    const directUsage = usageIndex(false);
    const allUsage = usageIndex(true);
    const selectedMenus = new Set();
    const expanded = new Set();
    let activeName = "";
    let savedFilters = null;

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }
    function button(className, text, onClick) {
      const node = element("button", className, text);
      node.type = "button";
      node.addEventListener("click", onClick);
      return node;
    }
    function checkbox(text) {
      const label = element("label", "ing-check");
      const input = element("input");
      input.type = "checkbox";
      label.append(input, element("span", "", text));
      return [label, input];
    }

    const tools = element("div", "ing-tools");
    const searchWrap = element("label", "ing-search");
    const search = element("input");
    search.type = "search";
    search.placeholder = "식재료 또는 메뉴 검색";
    search.setAttribute("aria-label", "식재료 또는 메뉴 검색");
    searchWrap.append(search);

    const sortWrap = element("label", "ing-sort");
    const sort = element("select");
    sort.id = "ingredient-sort";
    sort.setAttribute("aria-label", "식재료 정렬");
    for (const [value, name] of [
      ["most", "많이 쓰는 순"], ["least", "적게 쓰는 순"], ["name", "이름순"]
    ]) {
      const option = element("option", "", name);
      option.value = value;
      sort.append(option);
    }
    sortWrap.append(element("span", "", "정렬"), sort);
    const [soloLabel, includeSolo] = checkbox("단독 재료 포함");
    const [prepLabel, includePrep] = checkbox("배합 속 재료 포함");
    const scope = element("div", "ing-scope");
    scope.append(soloLabel, prepLabel);
    tools.append(searchWrap, sortWrap, scope);

    const compare = element("details", "ing-compare");
    compare.append(element("summary", "", "메뉴끼리 공용 재료 비교"));
    const compareBody = element("div", "ing-compare-body");
    const menuSelect = element("select");
    menuSelect.setAttribute("aria-label", "비교할 메뉴 추가");
    const chosen = element("div", "ing-chosen");
    const comparison = element("div", "ing-comparison");
    comparison.setAttribute("aria-live", "polite");
    compareBody.append(menuSelect, chosen, comparison);
    compare.append(compareBody);

    const resultHeader = element("div", "ing-head");
    const count = element("span", "ing-count");
    count.setAttribute("aria-live", "polite");
    resultHeader.append(count, element("span", "ing-head-menus", "원가표 사용처 기준"));
    const list = element("ul", "ing-list");
    const blank = element("p", "ing-empty");
    root.append(tools, compare, resultHeader, list, blank);

    function renderComparison() {
      menuSelect.replaceChildren();
      const starter = element("option", "", "＋ 비교할 메뉴 추가");
      starter.value = "";
      menuSelect.append(starter);
      const categories = new Map();
      for (const menu of menus) {
        if (selectedMenus.has(menu.id)) continue;
        if (!categories.has(menu.category)) {
          const group = element("optgroup");
          group.label = menu.category;
          categories.set(menu.category, group);
          menuSelect.append(group);
        }
        const option = element("option", "", menu.name);
        option.value = menu.id;
        categories.get(menu.category).append(option);
      }
      chosen.replaceChildren(...[...selectedMenus].map(id => {
        const menu = byId.get(id);
        const chip = button("ing-chosen-menu", menu.name + " ×", () => {
          selectedMenus.delete(id);
          renderComparison();
          menuSelect.focus();
        });
        chip.setAttribute("aria-label", menu.name + " 비교에서 빼기");
        return chip;
      }));
      if (selectedMenus.size < 2) {
        comparison.replaceChildren(element("p", "", "비교할 메뉴를 2개 이상 골라 주세요."));
        return;
      }
      const ingredientSets = [...selectedMenus].map(id => new Set(inputs(byId.get(id), includePrep.checked)));
      const common = [...ingredientSets[0]].filter(name => ingredientSets.every(names => names.has(name))).sort(collate);
      const title = element("p", "ing-common-title", "공통 재료 " + common.length + "종");
      const chips = element("div", "ing-common");
      chips.append(...common.map(name => button("ing-menu", name, () => {
        if (window.openIngredientBoard) window.openIngredientBoard(name);
        else open(name);
        list.querySelector(".ing-name")?.focus({ preventScroll: true });
        list.scrollIntoView({ block: "nearest" });
      })));
      comparison.replaceChildren(title, chips);
    }

    function renderIngredient(name, matchedMenus, searchTerm) {
      const item = element("li", "ing-row");
      item.dataset.ingredient = name;
      const heading = element("div", "ing-item-heading");
      const label = element("h2", "ing-name");
      const trigger = button("ing-picture-trigger", "", () => window.showIngredientDetail(name, matchedMenus, trigger));
      trigger.setAttribute("aria-haspopup", "dialog");
      const art = element("span", "ing-row-art");
      art.setAttribute("aria-hidden", "true");
      art.innerHTML = window.ingredientArt(name);
      trigger.append(art, element("span", "", name));
      label.append(trigger);
      label.tabIndex = -1;
      heading.append(label, element("span", "ing-usage-count", matchedMenus.length + "개 메뉴"));
      const actions = element("div", "ing-menu-links");
      const names = [...matchedMenus].sort((a, b) =>
        Number(normalize(b.name).includes(searchTerm)) - Number(normalize(a.name).includes(searchTerm))
      );
      const visibleCount = 4;
      const isExpanded = expanded.has(name);
      const menuButtons = names.map((menu, index) => {
        const link = button("ing-menu", menu.name, () => window.openMenuList(menu.id));
        link.dataset.menuId = menu.id;
        link.hidden = index >= visibleCount && !isExpanded;
        return link;
      });
      actions.append(...menuButtons);
      if (menuButtons.length > visibleCount) {
        const more = button("ing-more", "", () => {
          const show = !expanded.has(name);
          if (show) expanded.add(name);
          else expanded.delete(name);
          menuButtons.slice(visibleCount).forEach(link => { link.hidden = !show; });
          updateMore(show);
        });
        const updateMore = show => {
          more.textContent = show ? "접기 ↑" : "외 " + (menuButtons.length - visibleCount) + "개 보기 ↓";
          more.setAttribute("aria-expanded", String(show));
          more.setAttribute("aria-label", name + " 사용 메뉴 " + more.textContent);
        };
        updateMore(isExpanded);
        actions.append(more);
      }
      item.append(heading, actions);
      return item;
    }

    function render() {
      const query = normalize(search.value.trim());
      const usage = includePrep.checked ? allUsage : directUsage;
      const displayed = [...usage].filter(([name, usingMenus]) => {
        if (activeName) return name === activeName;
        if (usingMenus.length < 2 && !includeSolo.checked) return false;
        return normalize(name).includes(query) ||
          usingMenus.some(menu => normalize(menu.name).includes(query));
      });
      displayed.sort(([firstName, firstMenus], [nextName, nextMenus]) => {
        if (sort.value === "name") return collate(firstName, nextName);
        const countDifference = nextMenus.length - firstMenus.length;
        const direction = sort.value === "least" ? -1 : 1;
        return direction * countDifference || collate(firstName, nextName);
      });

      count.textContent = "식재료 " + displayed.length + "종";
      list.replaceChildren(...displayed.map(([name, usingMenus]) => renderIngredient(name, usingMenus, query)));
      blank.hidden = displayed.length > 0;
      blank.textContent = search.value ? "검색 조건에 맞는 식재료가 없습니다." : "이 범위에 표시할 식재료가 없습니다.";
    }

    function open(name) {
      if (!allUsage.has(name)) return;
      if (!savedFilters) savedFilters = {
        search: search.value, includeSolo: includeSolo.checked, includePrep: includePrep.checked
      };
      activeName = name;
      search.value = name;
      if (!directUsage.has(name)) includePrep.checked = true;
      if ((includePrep.checked ? allUsage : directUsage).get(name).length < 2) includeSolo.checked = true;
      expanded.add(name);
      render();
      renderComparison();
    }
    function clear() {
      if (!savedFilters) return;
      activeName = "";
      search.value = savedFilters.search;
      includeSolo.checked = savedFilters.includeSolo;
      includePrep.checked = savedFilters.includePrep;
      savedFilters = null;
      render();
      if (compare.open) renderComparison();
    }

    search.addEventListener("input", () => {
      activeName = "";
      savedFilters = null;
      render();
    });
    sort.addEventListener("change", render);
    includeSolo.addEventListener("change", () => {
      activeName = "";
      savedFilters = null;
      render();
    });
    includePrep.addEventListener("change", () => {
      activeName = "";
      savedFilters = null;
      render();
      if (compare.open) renderComparison();
    });
    menuSelect.addEventListener("change", () => {
      if (!byId.has(menuSelect.value)) return;
      selectedMenus.add(menuSelect.value);
      renderComparison();
    });
    render();
    renderComparison();
    window.IngredientView = { open, clear };
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", initialize, { once: true });
  else initialize();
})();

      if (content !== undefined) node.textContent = content;
      return node;
    }

    function action(className, label, callback) {
      const node = element('button', className, label);
      node.type = 'button';
      node.addEventListener('click', callback);
      return node;
    }

    function arrow(className, direction) {
      const node = element('span', className, direction);
      node.setAttribute('aria-hidden', 'true');
      return node;
    }

    const list = element('div', 'kt-list');
    const panel = element('div', 'kt-recipe');
    panel.hidden = true;
    const listTitle = element('h1', 'kt-list-title', '주방 메뉴');
    const controls = element('div', 'kt-controls');
    const selector = element('div', 'kt-filters');
    selector.setAttribute('role', 'group');
    selector.setAttribute('aria-label', '메뉴 분류');
    const searchWrap = element('label', 'kt-search');
    const search = element('input', '');
    search.type = 'search';
    search.placeholder = '메뉴 이름 검색';
    search.setAttribute('aria-label', '메뉴 이름 검색');
    searchWrap.append(search);
    search.addEventListener('input', () => {
      query = search.value;
      drawCatalog();
    });
    const catalog = element('div', 'kt-catalog');
    const count = element('span', 'kt-sr-only');
    count.setAttribute('aria-live', 'polite');
    controls.append(selector, searchWrap, count);
    list.append(listTitle, controls, catalog);
    root.append(list, panel);

    for (const name of ['', ...categories]) {
      const filter = action('kt-filter', name || '전체', () => {
        category = name;
        drawCatalog();
      });
      filter.dataset.category = name;
      selector.append(filter);
    }

    function createMenuTile(menu) {
      const tile = action('kt-menu', undefined, () => {
        window.openMenuList(menu.id);
      });
      tile.dataset.menuId = menu.id;
      tile.append(element('span', '', menu.name), arrow('kt-menu-arrow', '›'));
      return tile;
    }

    function drawCatalog() {
      const term = normalize(query);
      const matching = menus.filter(menu => {
        const value = normalize(menu.name + menu.category);
        return (!category || menu.category === category || (category === '쌀국수' && menu.category === '추가 고기')) && value.includes(term);
      });
      count.textContent = matching.length + '개 메뉴';
      for (const filter of selector.children) {
        filter.setAttribute('aria-pressed', String(filter.dataset.category === category));
      }
      catalog.replaceChildren();
      if (!matching.length) {
        catalog.append(element('p', 'kt-empty', '검색 조건에 해당하는 메뉴가 없어요.'));
        return;
      }
      for (const name of categories) {
        const entries = matching.filter(menu => menu.category === name);
        if (!entries.length) continue;
        const section = element('section', 'kt-category');
        const heading = element('h2', 'kt-category-title', name);
        const grid = element('div', 'kt-grid');
        grid.append(...entries.map(createMenuTile));
        section.append(heading, grid);
        catalog.append(section);
      }
    }

    function ingredientRow(ingredient) {
      const row = element('li', 'kt-ingredient');
      const label = element('div', 'kt-ingredient-label');
      label.append(element('span', 'kt-ingredient-name', ingredient.name));
      if (ingredient.note) label.append(element('small', 'kt-ingredient-note', ingredient.note));
      const amount = element('strong', 'kt-amount', ingredient.amount || '확인 필요');
      if (!ingredient.amount || /확인|미정|미기재/.test(ingredient.amount)) amount.classList.add('kt-unconfirmed');
      row.append(label, amount);
      return row;
    }

    function open(id) {
      const menu = byId.get(id);
      if (!menu) {
        showList();
        return false;
      }

      const recipe = servings[id];
      const bread = element('div', 'kt-recipe-bar');
      const back = action('kt-back', '', () => window.openKitchenList());
      back.append(arrow('kt-back-arrow', '‹'), element('span', '', '메뉴 선택'));
      bread.append(back);

      const header = element('header', 'kt-recipe-title');
      const info = element('div', 'kt-recipe-info');
      info.append(element('span', '', menu.category));
      if (recipe?.status) info.append(element('span', 'kt-status', recipe.status));
      const title = element('h1', 'kt-recipe-name', menu.name);
      title.id = 'kt-recipe-name';
      title.tabIndex = -1;
      header.append(info, title);
      if (recipe?.portion) header.append(element('p', 'kt-portion', recipe.portion));

      const section = element('section', 'kt-measure');
      section.setAttribute('aria-labelledby', 'kt-measure-title');
      const measureTitle = element('h2', 'kt-measure-title', '1인분 재료');
      measureTitle.id = 'kt-measure-title';
      section.append(measureTitle);
      if (recipe?.note) section.append(element('p', 'kt-source-note', recipe.note));
      if (recipe?.items?.length) {
        const ingredientList = element('ul', 'kt-ingredients');
        ingredientList.append(...recipe.items.map(ingredientRow));
        section.append(ingredientList);
      } else {
        section.append(element('p', 'kt-empty', '이 메뉴의 원가표 투입량을 확인해야 해요.'));
      }

      list.hidden = true;
      panel.hidden = false;
      const recipeBody = element('div', 'kt-recipe-body');
      panel.replaceChildren(bread, header, recipeBody);
      window.attachCooking(id, recipeBody, section);
      title.focus({preventScroll: true});
      return true;
    }

    function showList() {
      const fromRecipe = !panel.hidden;
      panel.hidden = true;
      list.hidden = false;
      if (fromRecipe) selector.querySelector('[aria-pressed="true"]')?.focus({preventScroll: true});
    }

    drawCatalog();
    window.Kitchen = {open, showList};
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', mountKitchen, {once: true});
  } else {
    mountKitchen();
  }
})();

(() => {
  "use strict";

  const ingredients = document.getElementById("ingredients");
  const kitchen = document.getElementById("kitchen");
  const ingredientTab = document.getElementById("ingredient-tab");
  const kitchenTab = document.getElementById("kitchen-tab");
  const menus = new Set(window.MENU_DATA.menus.map(menu => menu.id));
  const ingredientNames = new Set(window.MENU_DATA.menus.flatMap(menu => menu.ingredients));

  function renderRoute({resetScroll = false} = {}) {
    const hash = location.hash.slice(1);
    const query = new URLSearchParams(hash);
    const selectedMenu = query.get("menu");
    const selectedIngredient = query.get("ingredient") || query.get("art");
    const isRecipe = menus.has(selectedMenu);
    const isKitchen = hash === "kitchen" || isRecipe;

    ingredients.hidden = isKitchen;
    kitchen.hidden = !isKitchen;
    if (isKitchen) {
      kitchenTab.setAttribute("aria-current", "page");
      ingredientTab.removeAttribute("aria-current");
      if (isRecipe) window.Kitchen.open(selectedMenu);
      else window.Kitchen.showList();
    } else {
      ingredientTab.setAttribute("aria-current", "page");
      kitchenTab.removeAttribute("aria-current");
      if (ingredientNames.has(selectedIngredient)) window.IngredientView.open(selectedIngredient);
      else window.IngredientView.clear();
    }
    document.title = (isRecipe ? window.MENU_DATA.menus.find(menu => menu.id === selectedMenu).name + " · " : "") + "My Viet 브랜드 식자재";
    if (resetScroll) window.scrollTo(0, 0);
  }

  function navigate(hash, {focus = true} = {}) {
    if (location.hash === hash) return;
    history.pushState(null, "", hash);
    renderRoute({resetScroll:true});
    if (focus) {
      const title = (kitchen.hidden ? ingredients : kitchen).querySelector("h1");
      if (title) {
        title.tabIndex = -1;
        title.focus({preventScroll:true});
      }
    }
  }

  window.openMenuList = (id) => {
    if (menus.has(id)) navigate("#" + new URLSearchParams({menu:id}));
  };
  window.openKitchenList = () => navigate("#kitchen");
  window.openIngredientBoard = name => {
    if (ingredientNames.has(name)) navigate("#" + new URLSearchParams({ingredient:name}));
  };

  for (const tab of [ingredientTab,kitchenTab]) {
    tab.addEventListener("click", event => {
      if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
      event.preventDefault();
      navigate(tab.hash, {focus:false});
    });
  }

  document.addEventListener("DOMContentLoaded", () => {
    renderRoute();
    window.addEventListener("hashchange", () => renderRoute());
  });
})();

</script>
</body>
</html>
